<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>西川さん送別クイズ</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;background:#2b1055;color:#fff;min-height:100vh}
#app{max-width:1200px;margin:0 auto;padding:24px;text-align:center}
h1{font-size:2.4em;margin:.3em 0}
.qtext{font-size:2.2em;font-weight:bold;background:#fff;color:#222;border-radius:16px;padding:24px;margin:16px 0}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.ch{border-radius:14px;padding:22px;font-size:1.6em;font-weight:bold;position:relative;border:4px solid transparent;color:#fff}
.c0{background:#e21b3c}.c1{background:#1368ce}.c2{background:#d89e00}.c3{background:#26890c}
.dim{opacity:.3}
.ok{border-color:#fff;box-shadow:0 0 0 6px #3fe07a}
.dobon{box-shadow:0 0 0 6px #000}
.tag{position:absolute;top:-14px;right:10px;font-size:.6em;padding:2px 10px;border-radius:8px}
.tag.ok2{background:#3fe07a;color:#000}.tag.db{background:#000}
.cnt{font-size:.7em;opacity:.9;margin-top:6px}
.btn{background:#fff;color:#2b1055;border:none;border-radius:12px;padding:14px 28px;font-size:1.3em;font-weight:bold;margin:8px;cursor:pointer}
.btn.sub{background:#6b4fa3;color:#fff}
.btn:disabled{opacity:.4}
.timer{display:inline-block;width:90px;height:90px;line-height:90px;border-radius:50%;background:#6b4fa3;font-size:2.4em;font-weight:bold}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:1.3em;margin:8px 0}
.names{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0;max-height:40vh;overflow:auto}
.names span{background:#6b4fa3;padding:6px 14px;border-radius:20px;font-size:1.2em}
.qr{display:inline-block;background:#fff;padding:16px;border-radius:12px}
.rank{max-width:700px;margin:0 auto}
.rank div{display:flex;justify-content:space-between;background:#fff;color:#222;margin:8px 0;padding:12px 20px;border-radius:10px;font-size:1.4em;font-weight:bold}
.rank .first{background:#ffd700;font-size:1.9em}
.after{font-size:2.2em;font-weight:bold;color:#ffd700;margin:20px 0;animation:pop .6s}
@keyframes pop{0%{transform:scale(.3)}80%{transform:scale(1.1)}100%{transform:scale(1)}}
input{font-size:1.4em;padding:12px;border-radius:10px;border:none;width:100%;max-width:400px;text-align:center}
.big{font-size:2em;font-weight:bold;margin:24px 0}
.small{opacity:.7;font-size:.9em}
.pl .ch{font-size:1.3em;padding:24px 14px;cursor:pointer;user-select:none}
.pl .sel{border-color:#fff;box-shadow:0 0 0 5px #fff}
.pl .choices{grid-template-columns:1fr}
.res{font-size:2.6em;font-weight:bold;padding:30px;border-radius:16px;margin:20px 0}
.res.good{background:#26890c}.res.bad{background:#555}.res.boom{background:#000}
</style>
</head>
<body>
<div id="app">読み込み中…</div>
<script>
/* ======== クイズ内容（ここを書き換えれば別のクイズになります） ========
   correct / dobon は選択肢の番号（0=A, 1=B, 2=C, 3=D）
   得点は「正解した問題数」のみ（回答の速さは関係なし）。
   複数回答の問題は、正解の組み合わせと完全一致したときだけ正解。
*/
const DOBON_PENALTY = 0;   // ドボンを選んだとき減らす正解数（0＝表示だけ／1にすると-1）
const FINAL_TOP = 10;      // 最終発表で1人ずつ発表する上位人数（参加者は何人でもOK）
const QUIZ = {
  title: "西川さん送別クイズ",
  questions: [
    { text:"西川さんの毎日の日課は？",
      choices:["英語のドラマを見る","西川家の予実績管理をする","洗濯機が回るのを眺める"],
      correct:[0], dobon:[1], time:20 },
    { text:"西川さんの毎日の日課である英語ドラマ鑑賞ですが、最近見ているのはどれ？",
      choices:["グッド・ドクター","ランボー/怒りの予実績管理","ちいかわ（English ver.）"],
      correct:[0], dobon:[1], time:20 },
    { text:"西川さんがイタリア旅行で遭遇したトラブルはどれ？（複数回答可）",
      choices:["スリに遭った","スーツケースの鍵をなくした","乗継の飛行機が7時間遅れた"],
      correct:[0,1,2], dobon:[], time:30, multi:true },
    { text:"西川さんが最近いちばん驚いたこととは？",
      choices:["本社に異動になった","この飲み会の幹事が藤原さんだった","ベネチアで景色を眺めていたら3時間経っていた"],
      correct:[1], dobon:[], time:20 },
    { text:"西川さんが嫌いな業務はどれ？（複数回答可）",
      choices:["飲み会の幹事","予実績管理","キックオフ（人前で話すのが苦手なため）"],
      correct:[1,2], dobon:[], time:30, multi:true,
      after:"では最後に、人前でご挨拶をお願いします！" }
  ]
};
/* ================================================================ */

const $app = document.getElementById('app');
const L = "ABCD";
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params = new URLSearchParams(location.search);
const joinId = params.get('join');
const sameSet = (a,b) => a.length===b.length && [...a].sort().join()===[...b].sort().join();

if (joinId) player(joinId); else host();

/* ============================ HOST ============================ */
function host(){
  const roomId = 'nqz-' + Math.random().toString(36).slice(2,8);
  const players = {};            // key -> {name, score, conn, ans:{}, last}
  let phase = 'lobby', qi = -1, qStart = 0, tick = null, finalShown = 0, peerReady = false;
  const Q = () => QUIZ.questions[qi];
  const joinUrl = location.origin + location.pathname + '?join=' + roomId;
  const finalN = () => Math.min(FINAL_TOP, Object.keys(players).length);

  const peer = new Peer(roomId);
  peer.on('open', () => { peerReady = true; render(); });
  peer.on('disconnected', () => { try{ peer.reconnect(); }catch(e){} });
  peer.on('error', e => console.warn(e));
  peer.on('connection', conn => {
    conn.on('data', m => onMsg(conn, m));
    conn.on('close', () => { for (const k in players) if (players[k].conn === conn) players[k].conn = null; });
  });

  let renderTimer = null;
  function renderSoon(){ if (renderTimer) return; renderTimer = setTimeout(() => { renderTimer = null; render(); }, 300); }

  function onMsg(conn, m){
    if (m.t === 'join'){
      const name = String(m.name||'').slice(0,16) || 'ゲスト';
      if (!players[m.key]) players[m.key] = { name, score:0, ans:{}, last:null };
      players[m.key].conn = conn; players[m.key].name = name;
      conn.pkey = m.key;
      sendTo(m.key); if (phase==='lobby') renderSoon();
    } else if (m.t === 'answer'){
      const p = players[conn.pkey];
      if (!p || phase!=='question' || m.q!==qi || p.ans[qi]) return;
      const ch = [...new Set((m.choices||[]).filter(i => Number.isInteger(i) && i>=0 && i<Q().choices.length))];
      if (!ch.length) return;
      p.ans[qi] = { choices:ch, t:Date.now()-qStart };
      sendTo(conn.pkey);
      const all = Object.values(players);
      if (all.every(x => x.ans[qi])) closeQ(); else updateCounts();
    }
  }

  function ranking(){
    const arr = Object.values(players).sort((a,b) => b.score-a.score || a.name.localeCompare(b.name));
    arr.forEach((p,i) => p.rank = (i && arr[i-1].score===p.score) ? arr[i-1].rank : i+1);
    return arr;
  }
  function remain(){ return Math.max(0, Q().time - (Date.now()-qStart)/1000); }

  function stateFor(key){
    const p = players[key];
    const arr = (phase==='ranking'||phase==='final'||phase==='reveal') ? ranking() : Object.values(players);
    const s = { t:'state', phase, title:QUIZ.title, qi, total:QUIZ.questions.length,
      score:p.score, rank:p.rank||0, n:arr.length, name:p.name };
    if (qi>=0 && (phase==='question'||phase==='reveal')){
      const q = Q();
      s.q = { text:q.text, choices:q.choices, multi:!!q.multi };
      s.answered = !!p.ans[qi];
      s.remain = remain();
      if (phase==='reveal'){ s.last = p.last; s.correct = q.correct; s.after = q.after||''; }
    }
    if (phase==='final'){
      const N = finalN(), idx = arr.indexOf(p);
      s.revealed = idx < N ? (N - idx) <= finalShown : finalShown >= N;
    }
    return s;
  }
  function sendTo(key){ const p = players[key]; if (p && p.conn && p.conn.open) { try{ p.conn.send(stateFor(key)); }catch(e){} } }
  function broadcast(){ for (const k in players) sendTo(k); }

  function startQ(i){
    qi = i; phase = 'question'; qStart = Date.now();
    clearInterval(tick);
    tick = setInterval(() => {
      const el = document.getElementById('tm'); if (el) el.textContent = Math.ceil(remain());
      if (remain() <= 0) closeQ();
    }, 200);
    broadcast(); render();
  }
  function closeQ(){
    if (phase!=='question') return;
    clearInterval(tick); phase = 'reveal';
    const q = Q();
    for (const p of Object.values(players)){
      const a = p.ans[qi];
      if (!a){ p.last = { r:'none' }; continue; }
      if (q.dobon.some(d => a.choices.includes(d))){ p.score -= DOBON_PENALTY; p.last = { r:'dobon' }; }
      else if (sameSet(a.choices, q.correct)){ p.score += 1; p.last = { r:'ok' }; }
      else p.last = { r:'ng' };
    }
    ranking(); broadcast(); render();
  }
  function counts(){
    const c = Q().choices.map(()=>0); let n = 0;
    for (const p of Object.values(players)){ const a = p.ans[qi]; if (a){ n++; a.choices.forEach(i => c[i]++); } }
    return { c, n };
  }
  function updateCounts(){ const el = document.getElementById('ac'); if (el) el.textContent = counts().n + ' / ' + Object.keys(players).length; }

  function toFinal(){ phase='final'; finalShown=0; ranking(); broadcast(); render(); }
  function primary(){
    if (phase==='lobby'){ if (Object.keys(players).length) startQ(0); }
    else if (phase==='question') closeQ();
    else if (phase==='reveal'){ phase='ranking'; ranking(); broadcast(); render(); }
    else if (phase==='ranking'){
      if (qi < QUIZ.questions.length-1) startQ(qi+1); else toFinal();
    }
    else if (phase==='final'){ if (finalShown < finalN()){ finalShown++; broadcast(); render(); } }
  }
  document.addEventListener('keydown', e => { if (e.key==='Enter' || e.key===' ' || e.key==='ArrowRight'){ e.preventDefault(); primary(); } });
  window.primary = primary;
  window.skipRank = () => { if (qi < QUIZ.questions.length-1) startQ(qi+1); else toFinal(); };
  window.addEventListener('beforeunload', e => { if (phase!=='lobby'){ e.preventDefault(); e.returnValue=''; } });

  function render(){
    const ps = Object.values(players);
    let h = '';
    if (phase==='lobby'){
      h += `<h1>${esc(QUIZ.title)}</h1><p style="font-size:1.4em">スマホでQRを読み取って参加！</p>`;
      h += `<div class="qr" id="qr">${peerReady?'':'接続中…'}</div>`;
      h += `<p class="small">${peerReady?esc(joinUrl):''}</p>`;
      h += `<div class="big">参加者 ${ps.length} 人</div><div class="names">${ps.map(p=>`<span>${esc(p.name)}</span>`).join('')}</div>`;
      h += `<button class="btn" onclick="primary()" ${ps.length?'':'disabled'}>スタート ▶</button>`;
      h += `<p class="small">Enter / スペースキーでも進行できます。進行中はこのページを再読み込みしないでください。</p>`;
    } else if (phase==='question' || phase==='reveal'){
      const q = Q(), {c,n} = counts(), rv = phase==='reveal';
      h += `<div class="bar"><span>Q${qi+1} / ${QUIZ.questions.length}${q.multi?'　<b>（複数回答可）</b>':''}</span>`;
      h += rv ? '<span></span>' : `<span class="timer" id="tm">${Math.ceil(remain())}</span>`;
      h += `<span>回答 <b id="ac">${n} / ${ps.length}</b></span></div>`;
      h += `<div class="qtext">${esc(q.text)}</div><div class="choices">`;
      q.choices.forEach((t,i) => {
        const ok = q.correct.includes(i), db = q.dobon.includes(i);
        const cls = rv ? (ok?' ok':db?' dobon':' dim') : '';
        h += `<div class="ch c${i}${cls}">${rv&&ok?'<span class="tag ok2">正解</span>':''}${rv&&db?'<span class="tag db">ドボン！</span>':''}${L[i]}. ${esc(t)}${rv?`<div class="cnt">${c[i]} 人</div>`:''}</div>`;
      });
      h += `</div>`;
      if (rv && q.after) h += `<div class="after">${esc(q.after)}</div>`;
      h += rv ? `<button class="btn" onclick="primary()">途中ランキング ▶</button><button class="btn sub" onclick="skipRank()">${qi<QUIZ.questions.length-1?'次の問題へ':'最終結果へ'}</button>`
              : `<button class="btn sub" onclick="primary()">締め切る</button>`;
    } else if (phase==='ranking'){
      const arr = ranking().slice(0,5);
      h += `<h1>途中ランキング（Q${qi+1}終了時点）</h1><div class="rank">${arr.map(p=>`<div><span>${p.rank}位　${esc(p.name)}</span><span>${p.score}問正解</span></div>`).join('')}</div>`;
      h += `<button class="btn" onclick="primary()">${qi<QUIZ.questions.length-1?'次の問題へ ▶':'最終結果発表へ ▶'}</button>`;
    } else if (phase==='final'){
      const arr = ranking().slice(0, finalN()), N = arr.length, total = ps.length;
      h += `<h1>最終結果発表${total>N?'（上位'+N+'名）':''}</h1><div class="rank">`;
      arr.forEach((p,i) => {
        const shown = (N - i) <= finalShown;
        h += `<div class="${shown && p.rank===1?'first':''}"><span>${p.rank}位　${shown?esc(p.name):'？？？'}</span><span>${shown?p.score+'問正解':''}</span></div>`;
      });
      h += `</div>`;
      if (finalShown < N) h += `<button class="btn" onclick="primary()">次を発表 ▶</button>`;
      else h += `<div class="after">🎉 優勝 ${arr.filter(p=>p.rank===1).map(p=>esc(p.name)).join('・')} さん！ 🎉</div>` + (total>N?`<p class="small">${N+1}位以下の方は、スマホ画面で順位を確認できます</p>`:'');
    }
    $app.innerHTML = h;
    if (phase==='lobby' && peerReady) new QRCode(document.getElementById('qr'), { text:joinUrl, width:300, height:300 });
  }
  render();
}

/* ============================ PLAYER ============================ */
function player(hostId){
  let key = localStorage.getItem('qz-key-'+hostId);
  if (!key){ key = Math.random().toString(36).slice(2); localStorage.setItem('qz-key-'+hostId, key); }
  let name = localStorage.getItem('qz-name-'+hostId) || '';
  let peer = null, conn = null, st = null, stAt = 0, sel = [], tick = null, connecting = false;

  function connect(){
    if (connecting || (conn && conn.open)) return;
    connecting = true;
    if (!peer || peer.destroyed){
      peer = new Peer();
      peer.on('error', () => { connecting = false; setTimeout(connect, 2000); });
      peer.on('disconnected', () => { try{ peer.reconnect(); }catch(e){} });
    }
    const go = () => {
      conn = peer.connect(hostId, { reliable:true });
      conn.on('open', () => { connecting = false; conn.send({ t:'join', key, name }); });
      conn.on('data', m => { if (m.t==='state'){ if (!st || st.qi!==m.qi || st.phase!==m.phase) sel=[]; st=m; stAt=Date.now(); render(); } });
      conn.on('close', () => { connecting = false; conn = null; setTimeout(connect, 1500); });
      setTimeout(() => { if (connecting && !(conn && conn.open)){ connecting=false; try{conn.close();}catch(e){} connect(); } }, 8000);
    };
    if (peer.open) go(); else peer.once('open', go);
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden && name) connect(); });

  window.doJoin = () => {
    const v = document.getElementById('nm').value.trim();
    if (!v) return;
    name = v.slice(0,16); localStorage.setItem('qz-name-'+hostId, name);
    $app.innerHTML = '<div class="big">接続中…</div>'; connect();
  };
  window.pick = i => {
    if (!st || st.phase!=='question' || st.answered) return;
    if (st.q.multi){ sel = sel.includes(i) ? sel.filter(x=>x!==i) : [...sel, i]; render(); }
    else send([i]);
  };
  window.submitMulti = () => { if (sel.length) send(sel); };
  function send(ch){
    if (conn && conn.open){ conn.send({ t:'answer', q:st.qi, choices:ch }); st.answered = true; render(); }
  }

  function render(){
    clearInterval(tick);
    let h = '<div class="pl">';
    if (!name){
      h += `<h1>${esc(QUIZ.title)}</h1><p>ニックネームを入力してください</p><input id="nm" maxlength="16" placeholder="例：りく"><br><button class="btn" onclick="doJoin()">参加する</button>`;
    } else if (!st){
      h += '<div class="big">接続中…</div><p class="small">つながらない場合はページを再読み込みしてください</p>';
    } else {
      h += `<div class="bar"><span>${esc(st.name)}</span><span>${st.score}問正解</span></div>`;
      if (st.phase==='lobby') h += '<div class="big">参加完了！<br>開始までお待ちください</div>';
      else if (st.phase==='question'){
        const left = () => Math.max(0, Math.ceil(st.remain - (Date.now()-stAt)/1000));
        h += `<div class="bar"><span>Q${st.qi+1} / ${st.total}</span><span class="timer" id="tm" style="width:60px;height:60px;line-height:60px;font-size:1.6em">${left()}</span></div>`;
        h += `<div class="qtext" style="font-size:1.3em">${esc(st.q.text)}</div>`;
        if (st.answered) h += '<div class="big">回答しました！<br>結果をお待ちください</div>';
        else {
          h += `<div class="choices">${st.q.choices.map((t,i)=>`<div class="ch c${i}${sel.includes(i)?' sel':''}" onclick="pick(${i})">${st.q.multi?(sel.includes(i)?'☑ ':'☐ '):''}${L[i]}. ${esc(t)}</div>`).join('')}</div>`;
          if (st.q.multi) h += `<p>当てはまるものを全部選んで決定</p><button class="btn" onclick="submitMulti()" ${sel.length?'':'disabled'}>決定</button>`;
        }
        tick = setInterval(() => { const el=document.getElementById('tm'); if (el) el.textContent = left(); }, 250);
      } else if (st.phase==='reveal'){
        const r = st.last || { r:'none' };
        const m = { ok:['good','正解！'], ng:['bad','ざんねん…'], dobon:['boom','ドボン！'], none:['bad','時間切れ'] }[r.r];
        h += `<div class="res ${m[0]}">${m[1]}</div><p>正解：${st.correct.map(i=>L[i]+'. '+esc(st.q.choices[i])).join('<br>')}</p>`;
        if (st.after) h += `<div class="after" style="font-size:1.4em">${esc(st.after)}</div>`;
      } else if (st.phase==='ranking') h += `<div class="big">現在 ${st.rank}位 / ${st.n}人<br>${st.score}問正解</div>`;
      else if (st.phase==='final'){
        h += st.revealed ? `<div class="res ${st.rank===1?'good':'bad'}">${st.rank===1?'🎉 優勝！ 🎉':st.rank+'位 / '+st.n+'人'}<br>${st.score}問正解</div>` : '<div class="big">最終結果発表中…<br>ドキドキ</div>';
      }
    }
    $app.innerHTML = h + '</div>';
  }
  render();
  if (name) connect();
}
</script>
</body>
</html>
